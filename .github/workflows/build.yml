name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          # 如果 pubspec.yaml 在根目录，直接构建；如果在深层，自动切换
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build apk --release
          else
            TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            cd "$TARGET_DIR"
            flutter pub get
            flutter build apk --release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
